<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click on Cash World</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  color: #172033;
}
header {
  background: #123b70;
  color: white;
  padding: 20px;
  text-align: center;
}
.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 18px;
  margin: 15px 0;
  border-radius: 12px;
  box-shadow: 0 3px 12px #0001;
}
input, select, button {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #ccd3df;
  border-radius: 7px;
}
button {
  background: #087b50;
  color: white;
  border: none;
  font-weight: bold;
}
</style>
</head>
<body>
<header>
  <h1>Click on Cash World</h1>
  <p>Member Deposit & Withdrawal</p>
</header>

<div class="container">
  <div class="card">
    <h2>Deposit</h2>
    <form id="depositForm">
      <input name="member" placeholder="Member Name" required>
      <input name="mobile" placeholder="Member Mobile Number" required>

      <select name="method" required>
        <option value="">Select Payment Method</option>
        <option>Easypaisa</option>
        <option>JazzCash</option>
      </select>

      <input name="amount" type="number" placeholder="Package Amount (PKR)" required>
      <input name="transaction" placeholder="Transaction ID" required>
      <label>Payment Receipt</label>
      <input name="receipt" type="file" accept="image/*" required>

      <button type="submit">Submit Deposit</button>
    </form>
  </div>

  <div class="card">
    <h2>Withdrawal</h2>
    <form id="withdrawForm">
      <input name="member" placeholder="Member Name" required>
      <input name="mobile" placeholder="Member Mobile Number" required>

      <select name="method" required>
        <option value="">Select Payment Method</option>
        <option>Easypaisa</option>
        <option>JazzCash</option>
      </select>

      <input name="holder" placeholder="Account Holder Name" required>
      <input name="account" placeholder="Account Number" required>
      <input name="amount" type="number" placeholder="Withdrawal Amount (PKR)" required>

      <button type="submit">Submit Withdrawal</button>
    </form>
  </div>

  <div class="card">
    <h2>Admin Panel</h2>
    <p>Deposit and withdrawal requests will appear here after backend integration.</p>
  </div>
</div>

<script>
document.getElementById("depositForm").addEventListener("submit", function(e) {
  e.preventDefault();
  alert("Demo only: Backend connection is still required.");
});

document.getElementById("withdrawForm").addEventListener("submit", function(e) {
  e.preventDefault();
  alert("Demo only: Backend connection is still required.");
});
</script>
</body>
  </html>
